[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenplay-rag"
version = "0.1.0"
description = "Scene-aware screenplay retrieval and grounded question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "langchain-ollama",
    "langchain-chroma",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
screenplay-rag = "screenplay_rag.assistant:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
