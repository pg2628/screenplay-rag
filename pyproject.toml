[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenplay-rag"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
	"scikit-learn",
]

[project.optional-dependencies]
dev = [
	"pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
